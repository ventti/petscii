# Builds and packages every variant exactly as the release pipeline will, but
# creates no tag, no release and uploads nothing to a release - results land in
# workflow artifacts only. Used to iterate on packaging without spending versions.
#
#   gh workflow run build-test.yaml
#
# Safe by construction: no `contents: write` permission and no release step, so it
# cannot publish anything.
#
# Each platform exports its own variant: Processing 4.3 cannot cross-export a macOS
# app from Linux (its exporter reads Resources/en.lproj from inside the macOS
# bundle), so a single-host build is not possible. jpackage cannot cross-compile
# either, which makes one job per platform the natural shape.

name: build-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test
  cancel-in-progress: true

env:
  PROCESSING_VERSION: 4.3.4
  PROCESSING_TAG: processing-1297-4.3.4
  JAVA_VERSION: "17"

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: macos-aarch64
            os: macos-latest
            processing: processing-4.3.4-macos-aarch64.zip
          - variant: macos-x86_64
            os: macos-13            # last Intel runner
            processing: processing-4.3.4-macos-x64.zip
          - variant: windows-amd64
            os: windows-latest
            processing: processing-4.3.4-windows-x64.zip
          - variant: linux-amd64
            os: ubuntu-latest
            processing: processing-4.3.4-linux-x64.tgz
          - variant: linux-aarch64
            os: ubuntu-24.04-arm
            processing: processing-4.3.4-linux-arm64.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Processing for this host
        shell: bash
        run: |
          url="https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/${{ matrix.processing }}"
          curl -fsSL -o /tmp/processing_dl "$url"
          mkdir -p "$HOME/processing"
          case "${{ matrix.processing }}" in
            *.zip) unzip -q /tmp/processing_dl -d "$HOME/processing" ;;
            *.tgz) tar -xzf /tmp/processing_dl -C "$HOME/processing" ;;
          esac
          # Either a macOS .app bundle or a directory with core/library
          app=$(find "$HOME/processing" -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then
            app=$(find "$HOME/processing" -maxdepth 2 -type d -name 'core' -exec dirname {} \; | head -1)
          fi
          [ -n "$app" ] || { echo "could not locate Processing in $HOME/processing"; ls -R "$HOME/processing" | head -30; exit 1; }
          echo "PROCESSING_APP=$app" >> "$GITHUB_ENV"
          echo "found Processing at $app"

      # test: the same compile the release runs as its pre-release check
      - name: Compile the sketch
        shell: bash
        run: ./build.sh build

      - name: Export the variant
        shell: bash
        run: EMBED_JAVA=0 ./build.sh export "${{ matrix.variant }}"

      - name: Package a self-contained installer
        shell: bash
        run: |
          version="$(git describe --tags --abbrev=0)-test"
          bash mise-tasks/jpackage "$version" "${{ matrix.variant }}"
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.variant }}
          retention-days: 3
          path: dist/*
