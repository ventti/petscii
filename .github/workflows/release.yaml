# The whole release pipeline: build -> test -> package -> release.
#
#   plan     work out the next version and verify the release is possible
#   build    one job per platform: compile (test), export, and wrap into a
#            self-contained installer with jpackage
#   release  only once every installer exists: tag, write the changelog, publish
#            the release and attach the installers
#
# Packaging happens BEFORE anything is published, so a failed build cannot leave a
# release with missing binaries.
#
# With dry_run the release job is skipped altogether: every variant is still built,
# tested and packaged, and the installers are downloadable as workflow artifacts,
# but no tag, commit or release is created. Use it to exercise the whole pipeline
# without spending a version.
#
# One job per platform is not a choice: Processing cannot cross-export a macOS app
# from Linux (its exporter reads Resources/en.lproj from inside the macOS bundle),
# and jpackage cannot cross-compile at all - it drives each OS's own packaging
# tools. 32-bit ARM Linux has no runner, so it ships as a lean archive built by the
# release job itself (see RELEASE_BUILD_COMMAND in mise.toml).
#
#   gh workflow run release.yaml                          # rc, bump from commits
#   gh workflow run release.yaml -f rc=false -f option=minor
#   gh workflow run release.yaml -f dry_run=true          # build only, no release

name: release

on:
  workflow_dispatch:
    inputs:
      rc:
        description: Release candidate (prerelease) instead of a stable release
        type: boolean
        default: true
      option:
        description: Version bump
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Build and package everything, but create no tag or release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Processing 4.3.x keeps the classic core/ + modes/ layout that build.sh reads;
  # 4.5+ moved to a jpackage layout with hashed jar names and is not compatible.
  PROCESSING_VERSION: 4.3.4
  PROCESSING_TAG: processing-1297-4.3.4
  JAVA_VERSION: "17"
  PRE: ${{ inputs.rc && '--pre' || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@v4

      # The installers must be named before the tag exists, so take the version
      # from the release plan. The release job asserts it still matches.
      - name: Plan the release
        id: plan
        run: |
          mise run release:doctor
          mise run release --dry-run $PRE "${{ inputs.option }}" | tee /tmp/plan.txt
          version=$(sed -n 's/^[[:space:]]*Target:[[:space:]]*//p' /tmp/plan.txt | head -1)
          [ -n "$version" ] || { echo "could not read the target version from the plan"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version: $version"

  build:
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: macos-aarch64
            os: macos-latest
            processing: processing-4.3.4-macos-aarch64.zip
            jdk_arch: aarch64
          # Intel macOS is built on the Apple Silicon runner with an x86_64 JDK
          # (jpackage emits for its own JDK's architecture, and Rosetta runs it).
          # GitHub's last Intel image, macos-13, never got a runner in testing -
          # jobs sat queued for over an hour - and `needs:` waits even on a
          # continue-on-error job, which would stall every release.
          - variant: macos-x86_64
            os: macos-latest
            processing: processing-4.3.4-macos-aarch64.zip
            jdk_arch: x64
          - variant: windows-amd64
            os: windows-latest
            processing: processing-4.3.4-windows-x64.zip
            jdk_arch: x64
          - variant: linux-amd64
            os: ubuntu-latest
            processing: processing-4.3.4-linux-x64.tgz
            jdk_arch: x64
          - variant: linux-aarch64
            os: ubuntu-24.04-arm
            processing: processing-4.3.4-linux-arm64.tgz
            jdk_arch: aarch64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none

      # The JDK architecture decides what jpackage emits, which is how the Intel
      # macOS installer is produced on an Apple Silicon runner.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          architecture: ${{ matrix.jdk_arch }}

      - name: Install Processing for this host
        shell: bash
        run: |
          url="https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/${{ matrix.processing }}"
          curl -fsSL -o /tmp/processing_dl "$url"
          mkdir -p "$HOME/processing"
          case "${{ matrix.processing }}" in
            *.zip) unzip -q /tmp/processing_dl -d "$HOME/processing" ;;
            *.tgz) tar -xzf /tmp/processing_dl -C "$HOME/processing" ;;
          esac
          # Either a macOS .app bundle or a directory containing core/
          app=$(find "$HOME/processing" -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then
            app=$(find "$HOME/processing" -maxdepth 2 -type d -name 'core' -exec dirname {} \; | head -1)
          fi
          [ -n "$app" ] || { echo "could not locate Processing"; ls -R "$HOME/processing" | head -30; exit 1; }
          echo "PROCESSING_APP=$app" >> "$GITHUB_ENV"

      # test: the same compile the release runs as its pre-release check
      - name: Compile the sketch
        shell: bash
        run: ./build.sh build

      - name: Export the variant
        shell: bash
        run: EMBED_JAVA=0 ./build.sh export "${{ matrix.variant }}"

      # Runs the app in the layout jpackage ships (jars, natives and data/ in one
      # directory) FROM AN UNRELATED WORKING DIRECTORY, which is how an installed
      # app actually starts. Running it from the export root instead would pass
      # even when data/ is unreachable, because the export root contains a data/
      # of its own - that is exactly how the broken Windows installer slipped out.
      - name: Smoke test the packaged layout
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            windows-*) sep=';' ;;
            *)         sep=':' ;;
          esac
          src="build/${{ matrix.variant }}"
          stage="$PWD/build/smoke"
          rm -rf "$stage"; mkdir -p "$stage"
          if [ -d "$src/petscii.app/Contents/Java" ]; then
            cp -R "$src/petscii.app/Contents/Java/." "$stage/"
          else
            cp -R "$src/lib/." "$stage/"
            cp -R "$src/data" "$stage/"
          fi
          # java needs a native path; Git Bash paths are not one
          if [ "${{ runner.os }}" = "Windows" ]; then abs=$(cd "$stage" && pwd -W); else abs="$stage"; fi
          runner=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            runner="xvfb-run -a"
          fi
          mkdir -p "$RUNNER_TEMP/neutral" && cd "$RUNNER_TEMP/neutral"
          cp="$abs/petscii.jar$sep$abs/core.jar$sep$abs/gluegen-rt.jar$sep$abs/jogl-all.jar"
          $runner "$JAVA_HOME/bin/java" -Djna.nosys=true -Djava.library.path="$abs" \
            -Duser.dir="$abs" -cp "$cp" petscii -C64 > smoke.log 2>&1 &
          pid=$!
          sleep 25
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "FAILED: the app exited early"; cat smoke.log; exit 1
          fi
          kill "$pid" 2>/dev/null || true
          # prefs.txt is always reported missing and is harmless (it is optional and
          # searched in several places); anything else means data/ is unreachable.
          if grep -q NullPointerException smoke.log ||
             grep "is missing or inaccessible" smoke.log | grep -qv "prefs.txt"; then
            echo "FAILED: the app could not load its data"; cat smoke.log; exit 1
          fi
          echo "OK: ran for 25s with no missing resources"

      - name: Package a self-contained installer
        shell: bash
        run: |
          bash mise-tasks/jpackage "${{ needs.plan.outputs.version }}" "${{ matrix.variant }}"
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.variant }}
          retention-days: 7
          path: dist/*

  # Skipped entirely on a dry run, so nothing is tagged, pushed or published; the
  # installers from the build jobs remain downloadable as workflow artifacts.
  release:
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@v4

      # Needed for the 32-bit ARM archive and the pre-release compile check
      - name: Install Processing
        run: |
          curl -fsSL -o /tmp/processing.tgz \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64.tgz"
          tar -xzf /tmp/processing.tgz -C "$HOME"
          echo "PROCESSING_APP=$HOME/processing-${PROCESSING_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Git identity
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$RELEASE_ACTOR"
          git config user.email \
            "${RELEASE_ACTOR_ID}+${RELEASE_ACTOR}@users.noreply.github.com"

      # Staged outside the checkout on purpose: anything downloaded into the repo
      # would show up as untracked and the release task refuses a dirty tree.
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/installers

      - name: Show what will be published
        run: ls -l "$RUNNER_TEMP/installers"

      # Tags, writes the changelog, pushes and creates the release, attaching the
      # 32-bit ARM archive built by RELEASE_BUILD_COMMAND.
      - name: Create release
        run: mise run release $PRE "${{ inputs.option }}"

      # Guard against the plan and the actual release disagreeing, which would mean
      # the installers carry the wrong version in their names.
      - name: Attach installers
        run: |
          tag=$(git describe --tags --abbrev=0)
          expected="${{ needs.plan.outputs.version }}"
          if [ "$tag" != "$expected" ]; then
            echo "released tag $tag does not match the planned version $expected" >&2
            exit 1
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/installers/*
