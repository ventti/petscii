# Cuts a release: exports every platform variant, packages the Linux ones as
# .deb/.rpm, tags, and publishes everything to a GitHub Release.
#
# Everything runs on one Linux runner. Processing exports all platforms from any
# host (its core/library ships the native libs for each), and .rpm needs alien,
# which only exists on Linux - so a single Linux job covers the whole matrix with
# no per-platform duplication.
#
#   gh workflow run release.yaml                          # rc, bump from commits
#   gh workflow run release.yaml -f rc=false -f option=minor

name: release

on:
  workflow_dispatch:
    inputs:
      rc:
        description: Release candidate (prerelease) instead of a stable release
        type: boolean
        default: true
      option:
        description: Version bump
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Processing 4.3.x keeps the classic core/ + modes/ layout that build.sh reads;
  # 4.5+ moved to a jpackage layout with hashed jar names and is not compatible.
  PROCESSING_VERSION: 4.3.4
  PROCESSING_TAG: processing-1297-4.3.4

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUMP: ${{ inputs.option }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@v4

      - name: Install Processing and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends alien rpm
          curl -fsSL -o /tmp/processing.tgz \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64.tgz"
          tar -xzf /tmp/processing.tgz -C "$HOME"
          echo "PROCESSING_APP=$HOME/processing-${PROCESSING_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Git identity
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$RELEASE_ACTOR"
          git config user.email \
            "${RELEASE_ACTOR_ID}+${RELEASE_ACTOR}@users.noreply.github.com"

      - name: Verify release
        run: |
          mise run release:doctor
          mise run release --dry-run ${{ inputs.rc && '--pre' || '' }} "$RELEASE_BUMP"

      # Builds every variant and the Linux packages via RELEASE_BUILD_COMMAND
      # (mise run dist), then tags, pushes and uploads the archives.
      - name: Create release
        run: mise run release ${{ inputs.rc && '--pre' || '' }} "$RELEASE_BUMP"

      # The archives come from RELEASE_ARTIFACTS; the packages are attached here
      # because that glob has to match on macOS too, where they are not built.
      - name: Attach Linux packages
        run: |
          TAG=$(git describe --tags --abbrev=0)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.deb dist/*.rpm
