# Release task catalog: https://github.com/superteppo/release-scripts
#
# Setting task_config.includes replaces mise's default task directories, so the
# local ones are listed explicitly to keep local/future file tasks working.
[task_config]
includes = [
  "mise-tasks",
  ".mise-tasks",
  ".mise/tasks",
  ".config/mise/tasks",
  "mise/tasks",
  "git::https://github.com/superteppo/release-scripts.git//mise-tasks?ref=v1.6.0"
]

[env]
# No package manager owns a version here, so versions are derived from git tags:
# RELEASE_GET_VERSION / RELEASE_SET_VERSION are deliberately left unset.
# The existing tags (0.1.0, 0.2.0) are unprefixed, so keep the prefix empty
# instead of letting the default "v" start a second, inconsistent tag series.
RELEASE_TAG_PREFIX = ""

# This sketch has no test suite; compiling it is the available pre-release check.
RELEASE_CHECK_COMMAND = "./build.sh build"

# The release itself only builds 32-bit ARM Linux, the one variant no GitHub runner
# can package natively: it ships as a lean archive that needs a system Java. Every
# other variant is exported and wrapped into an installer by the release workflow's
# per-platform jobs, which attach their own output.
#
# Deliberately not "mise run dist" (all variants): Processing cannot cross-export a
# macOS app from Linux, so a release running on Linux must not try.
RELEASE_BUILD_COMMAND = "mise run dist linux-arm"
RELEASE_ARTIFACTS = "dist/*linux-arm.tar.gz"
